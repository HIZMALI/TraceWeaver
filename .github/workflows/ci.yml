name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  packaged-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Install project-scoped browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: .verification/overnight/browsers
        run: node web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: .venv/bin/python scripts/build_judge_wheel.py --output .verification/ci/wheel
      - name: Independent wheel, native browser and failure-copy checks (no model)
        run: .venv/bin/python scripts/verify_release.py --wheel .verification/ci/wheel/traceweaver-0.1.0-py3-none-any.whl --output .verification/ci/install
