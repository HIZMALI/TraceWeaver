name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  packaged-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Build the separate public frontend
        run: npm --prefix web run build:public
      - name: Install project-scoped browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: .verification/overnight/browsers
        run: node web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Complete native Relate browser regression
        run: npm --prefix web run test:e2e
      - name: Dedicated public native browser and security checks
        run: npm --prefix web run test:public
      - run: .venv/bin/python scripts/build_judge_wheel.py --output .verification/ci/wheel
      - name: Independent wheel, native browser and failure-copy checks (no model)
        run: .venv/bin/python scripts/verify_release.py --wheel .verification/ci/wheel/traceweaver-0.1.0-py3-none-any.whl --output .verification/ci/install
      - name: Build the deployment image from pinned Python and Node stages
        run: docker build --tag traceweaver-public:ci .
      - name: Independently installed public image, real browser and constrained resources
        run: .venv/bin/python scripts/verify_public_container.py --image traceweaver-public:ci --output .verification/ci/public-container
